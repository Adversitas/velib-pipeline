[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "velib"
version = "0.1.0"
description = "Incremental data pipeline on live Velib' open data: API ingestion to a raw landing zone, data contracts with quarantine, DuckDB bronze/silver/gold with SCD2, quality checks, Airflow DAG and a scheduled CI pipeline publishing a dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["duckdb>=1.1", "pydantic>=2.6", "httpx>=0.27", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
velib = "velib.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/velib"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# HTML/CSS template and long human-readable check rules.
"src/velib/report.py" = ["E501"]
"src/velib/quality.py" = ["E501"]
